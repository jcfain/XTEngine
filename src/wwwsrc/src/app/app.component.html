


<app-alerts></app-alerts>
<app-confirm-dialog></app-confirm-dialog>

@if (isConnecting) {
  <div class="loading-spinner-container" >
    <div class="loading-spinner"></div>
    <div style="padding-top: 10px;">
      Connecting to server...
    </div>
  </div>
} @else if (isAwaitingAuth || !isAuthenticated) {
  <app-auth
    (result)="onAuth($event)">
  </app-auth>
} @else {
  <div class="app-content" [class.app-content-external]="externalStreaming" [class.app-content-video-visible]="videoVisible">

    <!-- Top of page toolbar (YouTube style). The media list renders a second
         instance that only shows while full screen, where it is the media
         sheet's header - both share their UI state via
         MediaToolbarStateService. -->
    <app-media-toolbar class="app-toolbar" [class.app-toolbar-hidden]="isFullScreen"></app-media-toolbar>

    @if (externalStreaming) {
      <app-external-player></app-external-player>
    } @else {
      <app-video-player></app-video-player>
    }

    <app-video-suggestions></app-video-suggestions>

    <div class="app-body">
      <ng-container #mediaListHost>
        <app-media-list
          (rendered)="mediaLoaded = true">
        </app-media-list>
      </ng-container>
    </div>
    <app-footer></app-footer>
  </div>

  <!-- Settings modal for external player mode, where there is no video
       player to host it (the video player renders its own instance inside
       the video container so it also shows in full screen). It is not
       gated on externalStreaming so it survives the mode switch when the
       user toggles the "External player" checkbox from within it.
       mediaLoaded is the same gate the modal always had: the settings tabs
       bind to the server settings, which are only fetched once the media
       list has loaded. -->
  @if (mediaLoaded && settingsOpen) {
    <app-settings [isOpen]="true" (toggle)="settingsOpen = false"></app-settings>
  }
  @if (scriptStatusOpen) {
    <app-script-status></app-script-status>
  }
  @if (vrPlayerOpen) {
    <app-xr-player (close)="vrPlayerOpen = false"></app-xr-player>
  }
}
