


@if (isConnecting) {
  <div class="media-list-status" >
    <div class="loading-spinner"></div>
    <div style="padding-top: 10px;">
      Connecting to server...
    </div>
  </div>
} @else if (isAwaitingAuth || !isAuthenticated) {
  <app-auth
    (result)="onAuth($event)">
  </app-auth>
} @else {
  <div class="app-content">

    <app-header 
      (settingsClick)="toggleSettings()" 
      (scriptStatusClick)="toggleScriptStatus()"
      (logoutClick)="logout()">
    </app-header>
    <app-media-toolbar></app-media-toolbar>
    <app-video-player></app-video-player>

    <div class="app-body">
      <app-media-list (rendered)="mediaLoaded = true"></app-media-list>
    </div>
    <app-footer></app-footer>
  </div>

  @if (mediaLoaded && settingsOpen) {
    <app-settings [isOpen]="true" (toggle)="toggleSettings()"></app-settings>
  }
  @if (scriptStatusOpen) {
    <app-script-status></app-script-status>
  }
}
