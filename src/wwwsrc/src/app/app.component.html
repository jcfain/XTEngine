


<app-alerts></app-alerts>
<app-confirm-dialog></app-confirm-dialog>

@if (isConnecting) {
  <div class="loading-spinner-container" >
    <div class="loading-spinner"></div>
    <div style="padding-top: 10px;">
      Connecting to server...
    </div>
  </div>
} @else if (isAwaitingAuth || !isAuthenticated) {
  <app-auth
    (result)="onAuth($event)">
  </app-auth>
} @else {
  <div class="app-content">

    @if (externalStreaming) {
      <app-external-player></app-external-player>
    } @else {
      <app-video-player></app-video-player>
    }

    <div class="app-body">
      <ng-container #mediaListHost>
        <app-media-list
          (rendered)="mediaLoaded = true">
        </app-media-list>
      </ng-container>
    </div>
    <app-footer></app-footer>
  </div>

  <!-- Settings modal for external player mode, where there is no video
       player to host it (the video player renders its own instance inside
       the video container so it also shows in full screen). -->
  @if (externalStreaming && mediaLoaded && settingsOpen) {
    <app-settings [isOpen]="true" (toggle)="settingsOpen = false"></app-settings>
  }
  @if (scriptStatusOpen) {
    <app-script-status></app-script-status>
  }
  @if (vrPlayerOpen) {
    <app-xr-player (close)="vrPlayerOpen = false"></app-xr-player>
  }
}
