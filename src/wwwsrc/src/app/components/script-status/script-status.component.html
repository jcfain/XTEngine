<div class="script-status-container">
  <div class="script-status-model">
    <h3>Script Status</h3>
    @for (ch of channels; track ch) {
      <div class="script-status-div" [class.hidden]="ch.hidden">
        <label [style.color]="getChannelColor(ch.channel.channel)">{{ ch.channel.friendlyName }}: {{ ch.progressValue | number:'1.0-2' }}</label>
        <progress [value]="ch.progressValue" min="0" max="100" [style.color]="getChannelColor(ch.channel.channel)"></progress>
      </div>
    }
  </div>
