@if (isOpen) {
<div class="settings-modal">
    <div class="settings-modal-content">
        <div class="settings-modal-header">
            <span class="settings-modal-title">Settings</span>
            <button class="close-btn" (click)="onClose()">&times;</button>
        </div>
        <div class="tab-body">
            <div class="tab-row">
                @for (tab of tabs; track tab; let i = $index) {
                    <button class="tab-section-tab"
                        [class.tab-section-tab--active]="activeTab === i"
                        (click)="tabClick(i)">{{ tab }}</button>
                }
            </div>
            <section class="tab-section">
                @if (activeTab === 0) {
                    <app-settings-local-tab [isVisible]="true"></app-settings-local-tab>
                }
                @if (activeTab === 1) {
                    <app-settings-connections-tab [isVisible]="true" (onDirty)="markDirty()"></app-settings-connections-tab>
                }
                @if (activeTab === 2) {
                    <app-settings-motion-tab [isVisible]="true" (onDirty)="markDirty()"></app-settings-motion-tab>
                }
                @if (activeTab === 3) {
                    <app-settings-system-tab [isVisible]="true" (onDirty)="markDirty()" (restartRequiredChange)="onRestartRequiredChange($event)"></app-settings-system-tab>
                }
            </section>
        </div>
        
        <div class="settings-modal-footer">
            <div class="toolBarGroup toolBarGroupStart">
                <output-device-tools></output-device-tools>
            </div>
            <div class="toolBarGroup toolBarGroupEnd">
                <span class="restart-required" [class.hidden]="!restartRequired">Restart required</span>
                <span class="save-state" [class.save-success]="saveSuccess()" [class.save-fail]="saveFail()" [class.hidden]="!saveState">{{ saveState }}</span>
                <div class="footer-popup-wrap icon-button--group">
                    <button class="icon-button" title="More actions" (click)="showMoreActions = !showMoreActions">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
                    </button>
                    @if (showMoreActions) {
                        <div class="footer-popup">
                            <button title="This will only reset the local browser settings to default. Your settings stored on the XTP machine will remain." (click)="defaultLocalSettings(); showMoreActions = false">Default Local</button>
                            <button title="This will restart XTP" (click)="restartXTP(); showMoreActions = false">Restart XTP</button>
                            <button title="This will start the library loading process" (click)="refreshXTPLibrary(); showMoreActions = false">Refresh library</button>
                        </div>
                    }
                </div>
                <button class="icon-button save-button" [class.save-button-success]="saveSuccess()" [class.save-button-fail]="saveFail()" [class.save-button--dirty]="isDirty()" title="Save to XTP" [disabled]="!isDirty()" (click)="onSaveToXTP()">
                    <img class="buttonImage" src="://images/icons/save.svg" />
                </button>
            </div>
        </div>
    </div>
</div>
}
