@if (progressMessage) {
    <div class="status-output-bar">
        <label id="statusOutputLabel" for="statusOutput">{{ progressValue | number: '1.0-0' }}% {{ progressMessage }}</label>
        <progress id="statusOutput" class="progress-status" [value]="progressValue" min="0" max="100"></progress>
    </div>
}
<div class="footer">
    <div class="footerSection toolBar">
        <div class="toolBarGroup toolBarGroupStart">
            <output-device-tools></output-device-tools>
        </div>
    </div>
    <div class="footerSection toolBar">
        <div class="toolBarGroup toolBarGroupEnd">
            <input-device-tools></input-device-tools>
        </div>
    </div>
</div>
