<div class="tcode-commands-modal">
  <div class="tcode-header">
    <div class="tcode-filter">
      <input type="text" placeholder="Filter commands..." [(ngModel)]="filterText" />
    </div>
    <button class="tcode-close-button icon-button icon-button--dark" title="Close TCode commands" (click)="close.emit()">
      <svg class="buttonImage"><use href="#x"></use></svg>
    </button>
  </div>

  <div class="tcode-commands-container">
    @if (filteredCommands.length === 0) {
      <div class="no-commands">
        @if (commands.length === 0) {
          No TCode commands found. Visit the settings > system tab to add some.
        } @else {
          No commands match your filter.
        }
      </div>
    }
    @for (cmd of filteredCommands; track cmd) {
      <button
        class="tcode-commands-button"
        [class.hidden]="cmd.hidden"
        [title]="cmd.command"
        (click)="sendCommand(cmd)">{{ cmd.name }}</button>
    }
  </div>
</div>
