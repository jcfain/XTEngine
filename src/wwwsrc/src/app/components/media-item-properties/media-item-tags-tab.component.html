<div class="tags-tab tab-content" [class.hidden]="!isVisible">
    <div class="tags-filter">
        <input type="text"
            placeholder="Filter tags..."
            [(ngModel)]="filterText" />
    </div>

    <div class="tags-scroll">
        <div class="tags-grid">
            @for (tag of filteredTags; track tag) {
                <button class="tag-toggle"
                    [class.tag-toggle--active]="hasTag(tag)"
                    (click)="toggleTag(tag)">{{ tag }}</button>
            }
        </div>
        @if (!filteredTags.length) {
            <div class="tags-empty">No tags match your filter.</div>
        }
    </div>
</div>
