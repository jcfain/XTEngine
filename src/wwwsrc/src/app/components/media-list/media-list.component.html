<div class="media-list-container">
  <app-media-toolbar></app-media-toolbar>
  @if (noMedia()) {
    <div id="noMedia" class="media-list-status" style="text-align: center;">No media found</div>
  }
  @if (mediaLoading) {
    <div class="media-list-status" >
      <div class="loading-spinner"></div>
      <div style="padding-top: 10px;">{{mediaLoadingStatus}}</div>
    </div>
  }
  @if (!noMedia()) {
    <cdk-virtual-scroll-viewport #mediaListContainer class="media-list" [itemSize]="rowHeight" [minBufferPx]="rowHeight * 4" [maxBufferPx]="rowHeight * 8">
      <div *cdkVirtualFor="let row of rows; trackBy: trackRow" class="media-row">
          @for (item of row; track item.id) {
            <app-media-list-item
              #mediaNodes
              [item]="item"
              [width]="widthInt"
              [height]="heightInt"
              [thumbHeight]="thumbHeightInt"
              [thumbSize]="getThumbSize()"
              [textHeight]="textHeight"
              [fontSize]="fontSize"
              [tagsHeight]="tagsHeight"
              [tagsFontSize]="tagsFontSize"
              (click)="onItemClick(item)"
              (update)="updateMetadata(item)">
            </app-media-list-item>
          }
        </div>
    </cdk-virtual-scroll-viewport>
}
</div>
