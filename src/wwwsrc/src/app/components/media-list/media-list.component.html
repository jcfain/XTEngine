<div class="media-list-container">
  <app-media-toolbar></app-media-toolbar>
  <!-- Host for the suggestions drawer: re-parented here by SuggestionsOverlayService
       while full screen so it sits between the toolbar and the media list (a flex
       item, so it pushes the list down by its own height). Empty (zero height)
       when the suggestions are in their normal grid position. -->
  <div #suggestionsHost class="suggestions-host"></div>
  @if (noMedia()) {
    <div id="noMedia" class="media-list-status"><span class="media-list-status-text">No media found</span></div>
  }
  @if (mediaLoading) {
    <div class="loading-spinner-container" >
      <div class="loading-spinner"></div>
      <div style="padding-top: 10px;">{{mediaLoadingStatus}}</div>
    </div>
  }
  @if (!noMedia()) {
    <cdk-virtual-scroll-viewport #mediaListContainer class="media-list" [itemSize]="rowHeight" [minBufferPx]="rowHeight * 4" [maxBufferPx]="rowHeight * 8">
      <div *cdkVirtualFor="let row of rows; trackBy: trackRow" class="media-row">
          @for (item of row; track item.id) {
            <app-media-list-item
              #mediaNodes
              [item]="item"
              [width]="widthInt"
              [height]="heightInt"
              [thumbHeight]="thumbHeightInt"
              [thumbSize]="getThumbSize()"
              [textHeight]="textHeight"
              [fontSize]="fontSize"
              [tagsHeight]="tagsHeight"
              [tagsFontSize]="tagsFontSize"
              (click)="onItemClick(item)"
              (update)="updateMetadata(item)">
            </app-media-list-item>
          }
        </div>
    </cdk-virtual-scroll-viewport>
}
</div>
