<div class="media-toolbar">
  <button #tcodeActionsButton title="TCode actions" name="tcodeActionsButton" class="tcode-actions-button icon-button" [class.button-down]="!tcodeActionsInputHidden" (click)="tcodeActionsInputHidden = !tcodeActionsInputHidden">
    <img class="buttonImage" src="://images/icons/tcode.svg" />
  </button>
  <button #shuffleButton id="shuffleButton" title="Shuffle media play" class="shuffle-media-button icon-button" [class.button-down]="randomMode" (click)="toggleShufflePlay()">
    <img class="buttonImage" src="://images/icons/shuffle.svg" />
  </button>
  @if (randomMode) {
    <button #randomizeButton id="randomizeButton" title="Randomize media playlist" class="random-media-button icon-button" (click)="randomize()">
      <img class="buttonImage" src="://images/icons/reload.svg" />
    </button>
  }
  <div class="toolbar-right">
    @if (activeFilterCount > 0) {
      <button id="clearFiltersButton" class="clear-filters-button icon-button" title="Clear all filters" (click)="clearAllFilters()">
        <img class="buttonImage" src="://images/icons/x.svg" />
        <span class="filter-count-badge">{{ activeFilterCount }}</span>
      </button>
    }
    <button #tagButton id="tagButton" title="Filter tags" class="tag-media-button icon-button" [class.button-down]="!tagInputHidden" (click)="tagInputHidden = !tagInputHidden">
      <img class="buttonImage" src="://images/icons/tag.svg" />
    </button>
    <div class="toolbar-search">
      <input id="filterInput" class="toolbar-search-input" placeholder="Search" [ngModel]="filterText" (ngModelChange)="onFilterChange($event)" />
      <button class="side-action-filter-clear-button icon-button icon-button--small" (click)="clearFilterText()">
        <img class="buttonImage" src="://images/icons/x.svg" />
      </button>
    </div>
  </div>
</div>

<!-- TCode commands drawer: in-flow panel under the toolbar row. Collapses to
     zero height when hidden; expanding pushes the tag drawer and the media
     list down. Full width of the media list, scrolls when its content is
     tall. -->
<div class="toolbar-drawer" [class.open]="!tcodeActionsInputHidden">
  <div class="drawer-inner">
    <app-tcode-commands></app-tcode-commands>
  </div>
</div>

<!-- Tag filter drawer: sits under the TCode drawer when both are open -->
<div class="toolbar-drawer" [class.open]="!tagInputHidden">
  <div class="drawer-inner">
    <div id="tagFilterOptions" class="tag-filter-content">
      <div class="tag-filter-header">
        <input type="text" class="tag-filter-search" placeholder="Filter tags..." [(ngModel)]="tagFilterText" />
        <div class="system-tag-checkbox">
          <input title="If checked, the selected tags will be inclusive." id="tagFilterORChk" type="checkbox" value="OR" (click)="onTagClick($event)" [ngModel]="isTagSelected('OR')" />
          <label for="tagFilterORChk">OR</label>
        </div>
        <div class="tag-mode-toggle">
          <button type="button" [class.active]="tagSelectMode === 'include'" (click)="tagSelectMode = 'include'">Include</button>
          <button type="button" [class.active]="tagSelectMode === 'exclude'" (click)="tagSelectMode = 'exclude'">Exclude</button>
        </div>
      </div>
      <div class="tags-scroll">
        <div class="tags-grid">
          @for (tag of filteredTags; track tag) {
            <button class="tag-toggle" [class.tag-toggle--active]="isTagSelected(tag)" [class.tag-toggle--exclude]="isTagExcluded(tag)" (click)="onTagToggle(tag)">{{ isTagExcluded(tag) ? '✗ ' : '' }}{{ tag }} ({{
              getTagCount(tag) == getTagTotal(tag) ? getTagCount(tag) : getTagCount(tag)+'/'+getTagTotal(tag)
            }})</button>
          }
        </div>
        @if (!filteredTags.length) {
          <div class="tags-empty">No tags match your filter.</div>
        }
      </div>
    </div>
  </div>
</div>

@if (!scriptInputHidden) {
  <div id="scriptStatusModal" class="script-status-model">
    <div name="noScriptInput" style="align-self: center;">No script input</div>
    <div name="scriptStatusContainer"  class="script-status-container"></div>
  </div>
}
