<div class="motion-profiles-container" [style.width]="width">
  <div class="motion-profiles-model">
    @if (profiles.length === 0) {
      <div class="list-empty">No motion profiles. Visit the settings &gt; motion tab to add some.</div>
    }
    @for (profile of profiles; track profile) {
      <button
        class="button--pill"
        [class.button--pill--active]="profile === selectedProfile"
        (click)="selectProfile(profile)">{{ profile }}</button>
    }
  </div>
</div>
