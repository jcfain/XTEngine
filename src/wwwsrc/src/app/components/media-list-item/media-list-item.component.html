<div class="media-item"
  [style.width]="widthPX"
  [style.height]="heightPX"
  [class]="getItemClass(item)"
  (click)="onItemClick(item)">
  <app-media-list-item-context-menu 
    [item]="item"
    [fontSize]="fontSize"
    [hidden]="contextMenuHidden"
    [altScriptCount]="altScriptCount()"
    (close)="toggleContextMenu()">
  </app-media-list-item-context-menu>

  <!-- Large thumbnail on top (YouTube style) with corner status badges -->
  <div class="media-thumb" [style.height]="thumbHeightPX" [style.width]="widthPX">
    <img [lazySrc]="getThumbPath(item)" [alt]="item.name" class="media-thumb-nail" />
    <div class="media-overlay">
      <span class="play-icon">&#9654;</span>
    </div>
    @if (hasWatched()) {
      <div class="media-thumb-badge media-thumb-badge--watched" title="Watched">
        <svg [style.width]="headerButtonIconDimension()" [style.height]="headerButtonIconDimension()">
          <use href="#check"></use>
        </svg>
      </div>
    }
    @if (hasAltScripts()) {
      <div class="media-thumb-badge media-thumb-badge--alt" title="Alternate script count"
        [style.width]="headerButtonIconDimension()" [style.height]="headerButtonIconDimension()"
        [style.font-size]="altBadgeFontDimension()">
        {{altScriptCount()}}
      </div>
    }
    @if (hasSubtitle()) {
      <div class="media-thumb-badge media-thumb-badge--subtitle" title="Has subtitles">
        <img src="://images/icons/cc.svg" [style.width]="headerButtonIconDimension()" [style.height]="headerButtonIconDimension()">
      </div>
    }
  </div>

  <!-- Name row: friendly name on the left, favorite + context actions on the right -->
  <div class="media-item-name-row" [style.height]="textHeight" [style.width]="widthPX">
    <div class="name" [style.fontSize]="fontSize">{{ getItemName(item) }}</div>
    <div class="media-item-actions" click-stop-propagation>
      <button class="media-context" [style.width]="actionButtonPX" [style.height]="actionButtonPX" data-title="Tag favorite" (click)="toggleFavorite()">
        <svg [style.width]="actionIconDimension()" [style.height]="actionIconDimension()" [style.fill]="isFavorite() ? 'crimson' : 'transparent'" [style.stroke]="isFavorite() ? 'crimson' : 'grey'" >
          <use href="#heart"></use>
        </svg>
      </button>
      <button class="media-context" [style.width]="actionButtonPX" [style.height]="actionButtonPX" data-title="Media actions" (click)="toggleContextMenu()">
        <img src="://images/icons/context-menu.svg" [style.width]="actionIconDimension()" [style.height]="actionIconDimension()">
      </button>
    </div>
  </div>

  <!-- Tags row: truncated to half the item width with a "+<n>" overflow badge.
       The whole row is a shortcut to the media properties Tags tab. -->
  <div class="media-item-tags" #tagsContainer [style.height]="tagsHeight" [style.width]="tagsWidthPX"
    title="View all tags" click-stop-propagation (click)="openTagsProperties()">
    @for (tag of tags; track $index) {
      <span class="media-item-tag" #tagRef [style.fontSize]="tagsFontSize">{{ tag }}</span>
    }
    @if (overflowCount > 0) {
      <span class="media-item-tag media-item-tag--overflow" #overflowBadge [style.fontSize]="tagsFontSize">+{{ overflowCount }}</span>
    }
  </div>
</div>
