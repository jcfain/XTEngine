<button title="TCode device status (Click to connect)" 
    name="deviceStatusRetryButton" 
    class="icon-button icon-button--group" 
    [class.device-status-disconnected]="!isDeviceConnected()"
    [class.device-status-connected]="isDeviceConnected()"
    [class.device-status-error]="isDeviceError()"
    [class.device-status-connecting]="isDeviceConnecting()"
    (click)="tcodeDeviceConnectRetry()">
    <img name="connectionStatusIconImage" class="buttonImage" [src]="getStatusImage()" />
</button>
<button title="TCode device pause toggle" name="devicePauseStatusButton" class="icon-button icon-button--group script-status" (click)="togglePauseAllDeviceActions()">
    <img name="devicePauseStatusIconImage" class="buttonImage" [src]="getScriptPausedStatusImage()" />
</button>
<button  title="Send TCode home" name="deviceHomeButton" class="icon-button icon-button--group" (click)="sendDeviceHome()">
    <img name="deviceHomeButtonImage" class="buttonImage" src="://images/icons/home.svg" />
</button>
@if(!getDeviceLinkHidden()) {
<a [href]="getDeviceLink()" target="_blank">TCode device settings</a>
}
