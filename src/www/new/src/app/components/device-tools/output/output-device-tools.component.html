<button title="TCode device status\n(Click to connect)" name="deviceStatusRetryButton" class="icon-button icon-button--group device-status-retry-button"
    (click)="tcodeDeviceConnectRetry()">
    <img name="connectionStatusIconImage" class="buttonImage" src="://images/icons/reload.svg" />
</button>
<button title="TCode device pause toggle" name="devicePauseStatusButton" class="icon-button icon-button--group video-control--device-state" (click)="togglePauseAllDeviceActions()">
    <img name="devicePauseStatusIconImage" class="buttonImage" src="://images/icons/pause.svg" />
</button>
<button  title="Send TCode home" name="deviceHomeButton" class="icon-button icon-button--group" (click)="sendDeviceHome()">
    <img name="deviceHomeButtonImage" class="buttonImage" src="://images/icons/home.svg" />
</button>
