<div click-stop-propagation class="modal modal--alert">
    <div class="modal-content modal-content--alert">
        <div class="modal-header">
            <span class="modal-title">{{titleText}}</span>
            <button class="modal-close icon-button" (click)="closeEvent()">
                <img class="buttonImage" src="://images/icons/x.svg" />
            </button>
        </div>
        <div class="modal-body modal-body--alert">
        </div>
        <div class="modal-footer">
            <div class="modal-footer-content">{{content}}</div>
            <div class="modal-footer-content">
                <button (click)="acceptEvent()">
                    {{acceptText}}
                </button>
                <button (click)="closeEvent()">
                    {{rejectText}}
                </button>
            </div>
        </div>
    </div>
</div>
