<div class="auth-container">
  <div class="auth-box">
    <h2>XTP Web</h2>
    <p class="subtitle">Web authentication enabled. Please enter your password and click Login</p>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" class="styled-text" name="password"
             [(ngModel)]="password" (keydown)="onKeydown($event)" />
    </div>
    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" [(ngModel)]="remember" />
        Remember me
      </label>
    </div>
    <div *ngIf="error" class="error">{{ error }}</div>
    <button class="login-button" (click)="login()" [disabled]="loading">
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>
  </div>
</div>
