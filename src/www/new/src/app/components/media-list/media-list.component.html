<div class="media-list-container">
  <div class="media-list">
    <ng-container *ngFor="let item of mediaList">
      <app-media-list-item class="media-item" 
        [item]="item" 
        [width]="width" 
        [height]="height" 
        [thumbHeight]="thumbHeight" 
        [textHeight]="textHeight" 
        [fontSize]="fontSize"
        (click)="onItemClick(item)">
      </app-media-list-item>
      <!-- <div class="media-thumb" [style.height]="thumbHeight" [style.width]="thumbWidth">
        <ng-container [ngTemplateOutlet]="getLazyLoad() ? browserLazyLoad : myLazyLoad" [ngTemplateOutletContext]="{item: item}" />
        <div class="media-overlay">
          <span class="play-icon">&#9654;</span>
        </div>
      </div>
      <div class="media-name" [style.width]="width" [style.height]="textHeight" [style.fontSize]="fontSize">{{ item.name }}</div> -->
    </ng-container >
  </div>
</div>
