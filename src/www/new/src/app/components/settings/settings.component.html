<div class="settings-modal" [class.hidden]="!isOpen">
    <div class="settings-modal-content">
        <div class="settings-modal-header">
            <span class="settings-modal-title">Settings</span>
            <button class="close-btn" (click)="onToggle()">&times;</button>
        </div>
        <div class="settings-modal-body">
            <div class="tab-row">
                @for (tab of tabs; track tab; let i = $index) {
                    <button class="tab-section-tab"
                        [class.tab-section-tab--active]="activeTab === i"
                        (click)="tabClick(i)">{{ tab }}</button>
                }
            </div>
            <section class="tab-section">
                @if (activeTab === 0) {
                    <app-settings-local-tab></app-settings-local-tab>
                }
                @if (activeTab === 1) {
                    <app-settings-connections-tab
                        (onDirty)="markDirty()">
                    </app-settings-connections-tab>
                }
                @if (activeTab === 2) {
                    <app-settings-motion-tab
                        (onDirty)="markDirty()">
                    </app-settings-motion-tab>
                }
                @if (activeTab === 3) {
                    <app-settings-system-tab 
                        (onDirty)="markDirty()" 
                        (restartRequiredChange)="onRestartRequiredChange($event)">
                    </app-settings-system-tab>
                }
            </section>
        </div>
        
        <div class="settings-modal-footer">
            <div class="toolBarGroup toolBarGroupStart">
                <output-device-tools></output-device-tools>
            </div>
            <div class="settings-modal-footer-content">
                <span class="restart-required" [class.hidden]="!restartRequired">Restart required</span>
            </div>
            <div class="settings-modal-footer-content">
                <span class="save-state" [class.hidden]="!saveState">{{ saveState }}</span>
                <button title="This will only reset the local browser settings to default. Your settings stored on the XTP machine will remain."
                    (click)="defaultLocalSettings()">Default Local</button>
                <button title="This will restart XTP" (click)="restartXTP()">Restart XTP</button>
                <button title="This will start the library loading process" (click)="refreshXTPLibrary()">Refresh library</button>
                <button [disabled]="!formDirty" (click)="onSaveToXTP()">Save to XTP</button>
    <!-- <div class="formElement">
        <label></label>
        <div class="form-buttons">
        </div>
    </div> -->
            </div>
        </div>
    </div>
</div>
