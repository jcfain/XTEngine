<div class="connections-container">
  <h3>Connections</h3>

  <div class="connection-section">
    <h4>Input Device</h4>
    <div class="device-options">
      @for (device of inputDevices; track device) {
        <label>
          <input type="radio"
            [name]="'inputDevice'"
            [value]="device.type"
            [checked]="selectedInputDevice === device.type"
            (change)="onInputDeviceChange(device.type)" />
          {{ device.name }}
        </label>
      }
    </div>

    @if (selectedInputDevice === 2) {
      <div class="device-settings">
        <label>Deo VR Address
          <input type="text" [ngModel]="deoVRAddress" (ngModelChange)="onDeoVRAddressChange($event)" />
        </label>
        <label>Deo VR Port
          <input type="text" [ngModel]="deoVRPort" (ngModelChange)="onDeoVRPortChange($event)" />
        </label>
      </div>
    }
  </div>

  <div class="connection-section">
    <h4>Output Device</h4>
    <div class="device-options">
      @for (device of outputDevices; track device) {
        <label>
          <input type="radio"
            [name]="'outputDevice'"
            [value]="device.type"
            [checked]="selectedOutputDevice === device.type"
            (change)="onOutputDeviceChange(device.type)" />
          {{ device.name }}
        </label>
      }
    </div>

    @if (selectedOutputDevice === 1) {
      <div class="device-settings">
        <label>Network Address
          <input type="text" [ngModel]="networkAddress" (ngModelChange)="onNetworkAddressChange($event)" />
        </label>
        <label>Network Port
          <input type="text" [ngModel]="networkPort" (ngModelChange)="onNetworkPortChange($event)" />
        </label>
        <label>
          <input type="checkbox" [ngModel]="networkProtocolWebsocket" (ngModelChange)="onNetworkProtocolChange($event)" />
          Use WebSocket
        </label>
      </div>
    }

    @if (selectedOutputDevice === 0) {
      <div class="device-settings">
        <label>Serial Port
          <input type="text" [ngModel]="serialPort" (ngModelChange)="onSerialPortChange($event)" />
        </label>
      </div>
    }
  </div>

  <button class="retry-btn" (click)="retryConnection()">Retry Connection</button>
</div>
