<div class="side-actions">
  <div class="side-actions-container">
    <button #searchButton id="searchButton" title="Search media" class="search-media-button icon-button icon-button--group--vertical" (click)="filterInputHidden = !filterInputHidden">
      <img class="buttonImage" src="://images/icons/search.svg"/>
    </button> 
    <button #tagButton id="tagButton" title="Filter tags" class="tag-media-button icon-button icon-button--group--vertical" (click)="tagInputHidden = !tagInputHidden">
      <img class="buttonImage" src="://images/icons/tag.svg"/>
    </button> 
    <button #tcodeActionsButton title="TCode actions" name="tcodeActionsButton" class="tcode-actions-button icon-button icon-button--group--vertical"  (click)="tcodeActionsInputHidden = !tcodeActionsInputHidden">
      <img class="buttonImage" src="://images/icons/tcode.svg" />
    </button>
    <button #shuffleButton id="shuffleButton" title="Shuffle media play" class="shuffle-media-button icon-button icon-button--group--vertical" (click)="toggleShufflePlay()">
      <img class="buttonImage" src="://images/icons/shuffle.svg" />
    </button> 
    <button *ngIf="randomMode" #randomizeButton id="randomizeButton" title="Randomize media playlist" class="random-media-button icon-button icon-button--group--vertical" (click)="randomize()">
      <img class="buttonImage" src="://images/icons/reload.svg" />
    </button> 
  </div>
</div>

<ng-container *ngIf="!filterInputHidden" >
  <div id="filterInputContainer" class="side-action-filter-input-modal" [style.right.px]="searchButton.style.right" [style.top.px]="searchButton.style.top">
    <input id="filterInput" class="side-action-filter-input" placeholder="Filter" [ngModel]="filterText" (ngModelChange)="onFilterChange($event)" />
    <button class="side-action-filter-clear-button icon-button icon-button--small" (click)="filterText = ''">
      <img class="buttonImage" src="://images/icons/x.svg" />
    </button>
  </div>
</ng-container>

<div *ngIf="!tagInputHidden" id="tagFilterOptions" class="side-action-tag-filter-modal"></div>

<div *ngIf="!tcodeActionsInputHidden" id="tcodeActionsMain" class="side-action-tcode-action-modal">
  <h3>TCode actions</h3>
  <div id="actionButtons" class="side-action-tcode-action-container"></div>
</div>

<div *ngIf="!scriptInputHidden" id="scriptStatusModal" class="script-status-model">
  <div name="noScriptInput" style="align-self: center;">No script input</div>
  <div name="scriptStatusContainer"  class="script-status-container"></div>
</div>
