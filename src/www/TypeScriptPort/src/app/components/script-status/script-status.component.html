<div class="script-status-container" [class.hidden]="!isShown">
  <div class="script-status-modal" [class.hidden]="!isModalShown">
    <h3>Script Status</h3>
    <div *ngFor="let ch of channels" class="script-status-div" [class.hidden]="ch.hidden">
      <label [style.color]="getChannelColor(ch.channel.channel)">{{ ch.channel.friendlyName }}: {{ ch.progressValue | number:'1.0-2' }}</label>
      <progress [value]="ch.progressValue" min="0" max="100" [style.color]="getChannelColor(ch.channel.channel)"></progress>
    </div>
  </div>
  <div class="script-status-player" [class.hidden]="!isPlayerShown">
    <div *ngFor="let ch of channels" class="script-status-div" [class.hidden]="ch.hidden">
      <label [style.color]="getChannelColor(ch.channel.channel)">{{ ch.channel.friendlyName }}: {{ ch.progressValue | number:'1.0-2' }}</label>
      <progress [value]="ch.progressValue" min="0" max="100" [style.color]="getChannelColor(ch.channel.channel)"></progress>
    </div>
  </div>
</div>
